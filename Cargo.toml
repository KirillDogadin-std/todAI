[workspace]
members = ["crates/todai-core", "crates/todai-memory", "crates/todai-server", "crates/todai-client", "crates/todai-tui"]
# `cargo build` / `cargo test` at the root cover every crate.
default-members = [".", "crates/todai-core", "crates/todai-memory", "crates/todai-server", "crates/todai-client", "crates/todai-tui"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
todai-client = { path = "crates/todai-client" }
todai-core = { path = "crates/todai-core" }
todai-memory = { path = "crates/todai-memory" }
todai-server = { path = "crates/todai-server" }

# The CLI and the desktop window. The headless server is crates/todai-server.
[package]
name = "todai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A native board where coding agents post decisions and manual todos for the operator"

[dependencies]
anyhow.workspace = true
clap.workspace = true
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.35", default-features = false }
egui_commonmark = { version = "0.24.0", default-features = false, features = ["pulldown_cmark"] }
libc = "0.2.191"
serde.workspace = true
serde_json.workspace = true
# Already in the tree via epaint; used to check a system font parses before egui panics on it.
skrifa = { version = "0.42.1", default-features = false, features = ["std"] }
todai-client.workspace = true
todai-core.workspace = true
todai-server.workspace = true

[dev-dependencies]
tempfile.workspace = true

[profile.release]
lto = true
strip = true
codegen-units = 1
