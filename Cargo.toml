[package]
name = "todai"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "A native board where coding agents post decisions and manual todos for the operator"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.35", default-features = false }
egui_commonmark = { version = "0.24.0", default-features = false, features = ["pulldown_cmark"] }
libc = "0.2.191"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already in the tree via epaint; used to check a system font parses before egui panics on it.
skrifa = { version = "0.42.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
