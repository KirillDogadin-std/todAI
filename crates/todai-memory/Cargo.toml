[package]
name = "todai-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "todai's decision memory: an append-only SQLite event store; no dependency on the rest of todai"

[dependencies]
anyhow.workspace = true
# Bundled: no system libsqlite3 needed, and the same SQLite everywhere.
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# The embedder's tokenizer: punctuation classes and accent stripping, as BERT does them.
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile.workspace = true
