[package]
name = "todai-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless todai server: serves boards over HTTP to operator frontends"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Pure Rust, no image deps without default features: terminal QR codes for `pair`.
# Long-polls wait on inotify (or the platform equivalent) instead of re-statting.
notify = "8.2.0"
qrcode = { version = "0.14.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12.0"
todai-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
ureq = { version = "3.5.0", default-features = false, features = ["json"] }
