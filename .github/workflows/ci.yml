name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      # The headless server must build on its own and never pull in the GUI.
      - run: cargo build --locked -p todai-server
      - name: todai-server has no GUI dependencies
        run: |
          cargo tree --locked -p todai-server -e normal > server-deps.txt
          ! grep -E 'egui|eframe|winit|glow|rusqlite|todai-memory' server-deps.txt
      # Shared frontend logic: the TUI builds on it, so no GUI either.
      - name: todai-client has no GUI dependencies
        run: |
          cargo tree --locked -p todai-client -e normal > client-deps.txt
          ! grep -E 'egui|eframe|winit|glow|rusqlite|todai-memory' client-deps.txt
      # Memory is meant to be usable on its own: nothing else from todai.
      - name: todai-memory depends on no other todai crate
        run: |
          cargo tree --locked -p todai-memory -e normal > memory-deps.txt
          ! grep -E 'todai-(core|client|server|tui)' memory-deps.txt
      - name: todai-tui has no GUI dependencies
        run: |
          cargo tree --locked -p todai-tui -e normal > tui-deps.txt
          ! grep -E 'egui|eframe|winit|glow|rusqlite|todai-memory' tui-deps.txt
