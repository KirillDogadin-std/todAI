name: Release

# Pushing a tag vX.Y.Z builds the release tarballs and attaches them to a
# draft GitHub release. Write the notes on the draft, then publish it.
#
# x86_64 Linux is required: without it there is no release. aarch64 Linux
# and macOS (Apple silicon) are best effort: a failure there leaves their
# tarball out of the draft (say so in the notes) instead of blocking it.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian bullseye: the binaries need glibc 2.30+, not the runner's.
    container: rust:1.92-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
              sed -n 's/.*"name":"todai","version":"\([^"]*\)".*/\1/p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME but Cargo.toml says $version" >&2
              exit 1
          fi
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: scripts/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64-linux
          path: dist/
          if-no-files-found: error

  # Best effort: continue-on-error, and `release` doesn't wait for success.
  build-aarch64-linux:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    container: rust:1.92-bullseye
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: scripts/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64-linux
          path: dist/
          if-no-files-found: error

  build-macos:
    needs: build
    continue-on-error: true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # rustup comes with the runner and follows rust-toolchain.toml.
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: scripts/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64-macos
          path: dist/
          if-no-files-found: error

  release:
    needs: [build, build-aarch64-linux, build-macos]
    # Runs when the required build passed, whatever the extra ones did.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Draft release with the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls dist
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "💀 todai ${GITHUB_REF_NAME#v}" \
              --notes "Notes to be written before publishing."
